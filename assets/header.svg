<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Phan Tất Dũng — Full-stack Software Engineer</title>
  <desc id="desc">A navy and cyan engineering banner with a stylized application window.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#102b40"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#58a6ff"/><stop offset="1" stop-color="#56d4c1"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#58a6ff" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="310" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="310" rx="18" fill="url(#grid)"/>
  <rect x="55" y="59" width="40" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="55" y="125" font-size="46" font-weight="700" fill="#f0f6fc">Phan Tất Dũng</text>
    <text x="57" y="169" font-size="23" fill="#7ee7d6">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="57" y="214" font-size="19" fill="#b1bac4">From thoughtful interfaces to the systems behind them.</text>
    <text x="57" y="261" font-size="15" fill="#79c0ff" letter-spacing="2">TYPESCRIPT / NEXT.JS / NESTJS</text>
  </g>
  <g transform="translate(815 57)">
    <rect width="320" height="205" rx="12" fill="#0d1117" stroke="#303f50"/>
    <path d="M0 37H320" stroke="#303f50"/>
    <circle cx="21" cy="19" r="4" fill="#ff7b72"/><circle cx="37" cy="19" r="4" fill="#e3b341"/><circle cx="53" cy="19" r="4" fill="#56d4c1"/>
    <g font-family="Consolas,monospace" font-size="15">
      <text x="24" y="73" fill="#8b949e">// build something useful</text>
      <text x="24" y="108" fill="#ff7b72">const <tspan fill="#79c0ff">engineer</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
      <text x="42" y="139" fill="#c9d1d9">focus: <tspan fill="#a5d6ff">'full-stack'</tspan>,</text>
      <text x="42" y="170" fill="#c9d1d9">craft: <tspan fill="#a5d6ff">'web products'</tspan></text>
      <text x="24" y="195" fill="#c9d1d9">};</text>
    </g>
  </g>
  <rect y="305" width="1200" height="5" fill="url(#accent)"/>
</svg>
